<!--
  Pegar este bloque en GoHighLevel: Elemento "Custom JS/HTML" (Código personalizado) de la landing.
  Reemplazá:
    - NUMERO_WHATSAPP → número del bot con código de país, sin + ni espacios (ej: 5491112345678).
  El webhook de GHL ya está configurado dentro del widget.
-->
<iframe
  id="liwa-presupuestador"
  src="https://florenciaar.github.io/liwa-presupuestador/?wa=NUMERO_WHATSAPP"
  style="width:100%;max-width:700px;height:760px;border:0;display:block;margin:0 auto;overflow:hidden;"
  scrolling="no"
  title="Presupuestador LIWA Módulos"
  allow="clipboard-write"
></iframe>
<script>
  // Ajusta el alto del iframe automáticamente según el paso actual
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    var f = document.getElementById("liwa-presupuestador");
    if (!f) return;
    if (d.type === "liwa:height" && d.height) f.style.height = (d.height + 10) + "px";
    // if (d.type === "liwa:lead") { /* p.ej. disparar un píxel de Meta: fbq('track','Lead'); */ }
  });
</script>
